version: "3.9"

services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm db:deploy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tribalai3d?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tribalai_app
    command: pnpm start
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tribalai3d?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: artifacts
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SAM2_REPO_ROOT: /app/models/sam2
      SAM2_CHECKPOINT: /app/models/sam2/checkpoints/sam2.1_hiera_large.pt
      SAM2_TOOLS_DIR: /app/models/sam2/tools
      LOCAL_STORAGE_ROOT: /app/.local-storage
      SAM2_EXECUTION_MODE: mock
      SAM2_ALLOW_MOCK_FALLBACK: "true"
      SAM2_USE_CONDA: "true"
      SAM2_CONDA_COMMAND: conda
      SAM2_CONDA_ENV: sam2
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - local_storage:/app/.local-storage

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tribalai_worker
    command: pnpm worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/tribalai3d?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
      S3_BUCKET: artifacts
      S3_REGION: us-east-1
      S3_FORCE_PATH_STYLE: "true"
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      SAM2_REPO_ROOT: /app/models/sam2
      SAM2_CHECKPOINT: /app/models/sam2/checkpoints/sam2.1_hiera_large.pt
      SAM2_TOOLS_DIR: /app/models/sam2/tools
      LOCAL_STORAGE_ROOT: /app/.local-storage
      SAM2_EXECUTION_MODE: mock
      SAM2_ALLOW_MOCK_FALLBACK: "true"
      SAM2_USE_CONDA: "true"
      SAM2_CONDA_COMMAND: conda
      SAM2_CONDA_ENV: sam2
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - local_storage:/app/.local-storage

  postgres:
    image: postgres:16
    container_name: tribalai_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: tribalai3d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d tribalai3d"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: tribalai_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: tribalai_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:
  local_storage:
